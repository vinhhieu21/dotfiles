# -- Prefix ---------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# -- Defaults -------------------------------------------------------------
set -g mouse on
set -g escape-time 0
set -g history-limit 50000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename off
set -g focus-events on
set -g set-clipboard on
set -g detach-on-destroy off
set -g display-time 4000
set -g repeat-time 300
set -g status-interval 5

# -- True color -----------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# -- Vi copy mode ---------------------------------------------------------
set -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi H send-keys -X start-of-line
bind -T copy-mode-vi L send-keys -X end-of-line
# pbcopy on macOS; elsewhere `set-clipboard on` copies through the terminal (OSC 52).
if-shell 'command -v pbcopy >/dev/null' \
  'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel pbcopy' \
  'bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel'

# -- Keybindings (non-default only) ---------------------------------------
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind Tab last-window
bind e select-layout even-horizontal
bind E select-layout even-vertical
bind S setw synchronize-panes
bind x kill-pane
bind X kill-window
bind -r C-h previous-window
bind -r C-l next-window
bind / command-prompt -p "find-window" "find-window '%%'"
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# -- Catppuccin (installed by install.sh) ---------------------------------
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}#{E:@catppuccin_status_session}"
